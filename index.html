<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000010">
<meta name="description" content="Air Taxi 2099 — dodge buildings, collect fares in a neon cyberpunk city">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Air Taxi 2099">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Air Taxi 2099</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

  :root {
    --cyan: #0ff;
    --magenta: #f0f;
    --gold: #ffd700;
    --dark: #000010;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    /* Use dvh (dynamic viewport) where supported, fall back to svh then vh */
    min-height: 100svh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    touch-action: none;
    /* Prevent rubber-band scroll from shifting layout */
    position: fixed;
    inset: 0;
  }

  #gameWrapper {
    position: fixed;
    inset: 0;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    display: block;
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: clamp(8px,2vw,14px) clamp(10px,2.5vw,18px);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  .hud-box {
    background: rgba(0,0,20,0.75);
    border: 1px solid rgba(0,255,255,0.3);
    padding: clamp(4px,1vw,6px) clamp(8px,2vw,14px);
    border-radius: 2px;
  }

  .hud-label {
    font-size: clamp(7px,1.5vw,9px);
    color: rgba(0,255,255,0.9);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .hud-value {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px,4vw,22px);
    color: #fff;
    text-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(0,255,255,0.5);
    line-height: 1.1;
  }

  /* Leaderboard HUD button */
  #lbBtn {
    position: absolute;
    top: clamp(8px,2vw,14px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,20,0.8);
    border: 1px solid rgba(255,215,0,0.5);
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(7px,1.4vw,9px);
    letter-spacing: 2px;
    padding: clamp(4px,0.8vw,6px) clamp(8px,1.5vw,12px);
    cursor: pointer;
    z-index: 11;
    text-shadow: 0 0 6px var(--gold);
    transition: background 0.2s;
    pointer-events: all;
  }
  #lbBtn:hover { background: rgba(255,215,0,0.15); }

  /* ── Overlay ── */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,10,0.9);
    z-index: 20;
    gap: 0;
    transition: opacity 0.3s;
    padding: clamp(10px,3vw,20px);
  }
  #overlay.hidden { display: none; }

  .game-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px,7vw,38px);
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 50px rgba(0,255,255,0.5);
    letter-spacing: 2px;
    animation: titlePulse 2s ease-in-out infinite;
    line-height: 1;
  }

  .game-subtitle {
    font-size: clamp(8px,2vw,11px);
    color: var(--magenta);
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: 4px;
    text-shadow: 0 0 10px var(--magenta);
  }

  .divider {
    width: min(260px, 70%);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    margin: clamp(14px,3vw,28px) 0 clamp(10px,2.5vw,22px);
    opacity: 0.7;
  }

  .score-display {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(36px,10vw,54px);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,255,255,0.4);
    line-height: 1;
  }

  .score-label {
    font-size: clamp(8px,1.8vw,10px);
    color: rgba(0,255,255,0.9);
    letter-spacing: 5px;
    margin-bottom: 4px;
  }

  .best-row {
    margin-top: clamp(8px,2vw,14px);
    font-size: clamp(9px,2vw,11px);
    color: rgba(255,0,255,0.9);
    letter-spacing: 3px;
  }
  .best-val {
    color: var(--magenta);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px,2.5vw,13px);
    text-shadow: 0 0 8px var(--magenta);
  }

  .start-btn {
    margin-top: clamp(16px,4vw,32px);
    padding: clamp(10px,2.5vw,13px) clamp(24px,6vw,36px);
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px,2.5vw,13px);
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: color 0.2s, box-shadow 0.2s;
    text-shadow: 0 0 8px var(--cyan);
    box-shadow: 0 0 12px rgba(0,255,255,0.25), inset 0 0 12px rgba(0,255,255,0.06);
  }
  .start-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cyan);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
    z-index: -1;
  }
  .start-btn:hover { color: #000; box-shadow: 0 0 28px rgba(0,255,255,0.5); }
  .start-btn:hover::before { transform: scaleX(1); }

  .tip {
    margin-top: clamp(10px,2.5vw,18px);
    font-size: clamp(8px,1.8vw,10px);
    color: rgba(255,255,255,0.27);
    letter-spacing: 2px;
    animation: blink 1.4s step-end infinite;
  }

  .instructions {
    margin-top: clamp(14px,3vw,24px);
    display: flex;
    gap: clamp(10px,3vw,18px);
  }
  .inst-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: clamp(7px,1.6vw,9px);
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .inst-icon {
    width: clamp(24px,6vw,32px);
    height: clamp(24px,6vw,32px);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px,3vw,16px);
  }

  /* ── Leaderboard Panel ── */
  #lbPanel {
    position: absolute;
    inset: 0;
    background: rgba(0,0,12,0.97);
    z-index: 25;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(14px,4vw,28px) clamp(12px,3vw,24px);
    overflow-y: auto;
  }
  #lbPanel.hidden { display: none; }

  .lb-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(16px,5vw,24px);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 18px var(--gold);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .lb-sub {
    font-size: clamp(7px,1.6vw,9px);
    color: rgba(255,215,0,0.5);
    letter-spacing: 4px;
    margin-bottom: clamp(12px,3vw,20px);
  }
  .lb-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: clamp(10px,2.5vw,16px);
    opacity: 0.5;
  }

  .lb-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(4px,1vw,6px);
    max-height: 55vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,215,0,0.3) transparent;
  }

  .lb-row {
    display: grid;
    grid-template-columns: clamp(22px,5vw,32px) 1fr auto auto;
    align-items: center;
    gap: clamp(6px,1.5vw,10px);
    padding: clamp(6px,1.5vw,10px) clamp(8px,2vw,12px);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 2px;
    transition: background 0.2s;
    font-size: clamp(9px,2vw,12px);
  }
  .lb-row.my-score {
    background: rgba(255,215,0,0.07);
    border-color: rgba(255,215,0,0.3);
  }
  .lb-row.rank-1 { border-color: rgba(255,215,0,0.6); background: rgba(255,215,0,0.1); }
  .lb-row.rank-2 { border-color: rgba(192,192,192,0.5); background: rgba(192,192,192,0.06); }
  .lb-row.rank-3 { border-color: rgba(205,127,50,0.5); background: rgba(205,127,50,0.07); }

  .lb-rank {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(8px,1.8vw,11px);
    color: rgba(255,255,255,0.4);
    text-align: center;
  }
  .lb-row.rank-1 .lb-rank { color: var(--gold); text-shadow: 0 0 8px var(--gold); font-size: clamp(10px,2.5vw,14px); }
  .lb-row.rank-2 .lb-rank { color: #c0c0c0; }
  .lb-row.rank-3 .lb-rank { color: #cd7f32; }

  .lb-name {
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
    font-size: clamp(9px,2vw,12px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lb-row.my-score .lb-name { color: var(--gold); }

  .lb-score {
    font-family: 'Orbitron', sans-serif;
    color: var(--cyan);
    font-size: clamp(11px,2.5vw,15px);
    text-shadow: 0 0 8px rgba(0,255,255,0.6);
    text-align: right;
  }
  .lb-row.rank-1 .lb-score { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-size: clamp(12px,3vw,17px); }

  .lb-date {
    font-size: clamp(7px,1.4vw,9px);
    color: rgba(255,255,255,0.25);
    text-align: right;
  }

  .lb-empty {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: clamp(9px,2vw,11px);
    letter-spacing: 2px;
    padding: 30px 0;
  }

  /* Name entry */
  #nameEntry {
    width: 100%;
    margin-top: clamp(12px,3vw,20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px,2vw,12px);
  }
  .name-label {
    font-size: clamp(8px,1.8vw,10px);
    color: rgba(255,215,0,0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #nameInput {
    background: rgba(0,0,20,0.8);
    border: 1px solid rgba(255,215,0,0.5);
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    /* 16px minimum is the magic number — anything lower triggers iOS/Android auto-zoom */
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
    padding: clamp(6px,1.5vw,10px) clamp(12px,3vw,20px);
    width: min(240px, 80%);
    outline: none;
    text-transform: uppercase;
    /* Prevent the browser scrolling to the input and resizing the viewport */
    touch-action: manipulation;
    -webkit-user-select: text;
    user-select: text;
  }
  #nameInput:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,215,0,0.3); }
  #nameInput::placeholder { color: rgba(255,215,0,0.25); letter-spacing: 2px; font-size: 14px; }

  .lb-actions {
    display: flex;
    gap: clamp(8px,2vw,12px);
    margin-top: clamp(12px,3vw,20px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .lb-btn {
    padding: clamp(8px,2vw,11px) clamp(16px,4vw,26px);
    background: transparent;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(9px,2vw,11px);
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .lb-btn-gold {
    border: 2px solid var(--gold);
    color: var(--gold);
    text-shadow: 0 0 6px var(--gold);
  }
  .lb-btn-gold:hover { background: rgba(255,215,0,0.15); }
  .lb-btn-dim {
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.4);
  }
  .lb-btn-dim:hover { border-color: rgba(255,255,255,0.4); color: rgba(255,255,255,0.7); }

  /* My rank badge */
  .my-rank-badge {
    margin-top: clamp(10px,2.5vw,16px);
    font-size: clamp(8px,1.8vw,10px);
    color: rgba(255,215,0,0.7);
    letter-spacing: 2px;
    text-align: center;
  }
  .my-rank-badge span {
    color: var(--gold);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px,2.5vw,14px);
    text-shadow: 0 0 8px var(--gold);
  }

  /* Scanline + corners */
  #scanline {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    z-index: 30;
  }
  #cornerTL, #cornerTR, #cornerBL, #cornerBR {
    position: absolute;
    width: 18px; height: 18px;
    z-index: 31; pointer-events: none;
  }
  #cornerTL { top: 4px; left: 4px; border-top: 2px solid rgba(0,255,255,0.6); border-left: 2px solid rgba(0,255,255,0.6); }
  #cornerTR { top: 4px; right: 4px; border-top: 2px solid rgba(0,255,255,0.6); border-right: 2px solid rgba(0,255,255,0.6); }
  #cornerBL { bottom: 4px; left: 4px; border-bottom: 2px solid rgba(0,255,255,0.6); border-left: 2px solid rgba(0,255,255,0.6); }
  #cornerBR { bottom: 4px; right: 4px; border-bottom: 2px solid rgba(0,255,255,0.6); border-right: 2px solid rgba(0,255,255,0.6); }

  /* ── Update banner ── */
  #updateBanner {
    position: absolute;
    bottom: clamp(10px,3vw,18px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,20,0,0.92);
    border: 1px solid rgba(0,255,100,0.6);
    color: #0f6;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(9px,2vw,11px);
    letter-spacing: 2px;
    padding: clamp(6px,1.5vw,9px) clamp(12px,3vw,18px);
    cursor: pointer;
    z-index: 50;
    white-space: nowrap;
    text-shadow: 0 0 8px #0f6;
    box-shadow: 0 0 14px rgba(0,255,100,0.2);
    animation: slideUp 0.4s ease-out;
    display: none;
  }
  #updateBanner.visible { display: block; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px var(--cyan), 0 0 50px rgba(0,255,255,0.5); }
    50% { text-shadow: 0 0 30px var(--cyan), 0 0 70px var(--cyan); }
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Studio / Loading Screen ── */
  /* Pure HTML+CSS so it paints immediately, before the (large) game
     script has finished downloading and parsing. Hidden by JS once
     the game has fully initialized. */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 999;
    background:
      radial-gradient(ellipse 60% 45% at 28% 45%, rgba(255,46,136,0.22), transparent 70%),
      radial-gradient(ellipse 60% 45% at 72% 40%, rgba(45,226,230,0.16), transparent 70%),
      #0c0a17;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(10px,3vw,20px);
    transition: opacity 0.5s ease;
  }
  #loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  /* Studio logo — inline SVG from the J3 Interactive press kit
     (svg/j3-logo-stacked.svg). Inline rather than an <img> so it paints
     instantly and still works when the Android app loads this page from
     its offline cache (file://, where relative image paths don't resolve). */
  .ls-logo {
    display: block;
    width: clamp(130px, 38vw, 210px);
    height: auto;
    animation: lsLogoIn 0.6s ease-out both;
  }
  @keyframes lsLogoIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  .ls-presents {
    margin-top: clamp(12px,3vw,18px);
    font-size: clamp(8px,2vw,11px);
    letter-spacing: 8px;
    color: #ff2e88;
    text-shadow: 0 0 10px rgba(255,46,136,0.7);
  }
  .ls-divider {
    width: min(200px, 60%);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    margin: clamp(20px,5vw,36px) 0 clamp(16px,4vw,28px);
    opacity: 0.7;
  }
  .ls-game {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(12px,3vw,16px);
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
  }
  .ls-bar {
    margin-top: clamp(18px,4vw,28px);
    width: min(220px, 60%);
    height: 4px;
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 2px;
    overflow: hidden;
    background: rgba(0,255,255,0.05);
  }
  .ls-bar-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 8px var(--cyan);
    animation: lsBarSlide 1.2s ease-in-out infinite;
  }
  @keyframes lsBarSlide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  .ls-status {
    margin-top: clamp(10px,2.5vw,16px);
    font-size: clamp(8px,1.8vw,10px);
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
    animation: blink 1.4s step-end infinite;
  }

  /* Rank link on home/death screen */
  .rank-link {
    margin-top: clamp(10px,2.5vw,16px);
    background: transparent;
    border: none;
    color: rgba(255,215,0,0.75);
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(9px,2vw,11px);
    letter-spacing: 3px;
    cursor: pointer;
    text-decoration: none;
    text-shadow: 0 0 8px rgba(255,215,0,0.4);
    transition: color 0.2s, text-shadow 0.2s;
    padding: 4px 8px;
  }
  .rank-link:hover {
    color: var(--gold);
    text-shadow: 0 0 14px var(--gold);
  }

  /* Rewarded "continue" button (Android app only) */
  .continue-btn {
    margin-top: clamp(14px,3.5vw,26px);
    border-color: var(--gold);
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold);
    box-shadow: 0 0 14px rgba(255,215,0,0.3), inset 0 0 12px rgba(255,215,0,0.08);
    animation: continuePulse 1.6s ease-in-out infinite;
  }
  .continue-btn::before { background: var(--gold); }
  .continue-btn:disabled { opacity: 0.55; cursor: default; animation: none; }
  .continue-btn + .start-btn { margin-top: clamp(10px,2.5vw,16px); }
  @keyframes continuePulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,215,0,0.25), inset 0 0 12px rgba(255,215,0,0.06); }
    50%      { box-shadow: 0 0 26px rgba(255,215,0,0.55), inset 0 0 12px rgba(255,215,0,0.12); }
  }

  /* Privacy settings link (shown only when the consent rules require it) */
  .privacy-link {
    margin-top: 2px;
    color: rgba(255,255,255,0.4);
    text-shadow: none;
    font-size: clamp(8px,1.7vw,10px);
  }
  .privacy-link:hover { color: rgba(255,255,255,0.8); text-shadow: none; }

  /* Launchpad prompt */
  #launchPrompt {
    position: absolute;
    bottom: clamp(50px,12%,90px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 15;
    white-space: nowrap;
  }
  #launchPrompt.hidden { display: none; }
  .lp-line1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(9px,2.2vw,12px);
    color: var(--cyan);
    letter-spacing: 4px;
    text-shadow: 0 0 10px var(--cyan);
    animation: blink 1s step-end infinite;
  }
  .lp-line2 {
    font-size: clamp(7px,1.6vw,9px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    margin-top: 4px;
  }

<script>
// ============================================================
// AIR TAXI 2099 — Responsive + Leaderboard Edition
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;

// ── Fullscreen scaling ───────────────────────────────────────
// gameWrapper is fixed/inset-0 and clips its children with overflow:hidden.
// The canvas is sized and positioned explicitly so it covers the full
// viewport (cover mode) — no CSS transforms, works on all mobile browsers.
const gameWrapper = document.getElementById('gameWrapper');
function scaleGame() {
  canvas.width  = window.innerWidth  || 480;
  canvas.height = window.innerHeight || 640;
}
scaleGame();
window.addEventListener('resize', scaleGame);
window.addEventListener('orientationchange', () => {
  setTimeout(scaleGame, 100);
  setTimeout(scaleGame, 400);
});
setTimeout(scaleGame, 150);

// UI refs
const overlay      = document.getElementById('overlay');
const lbPanel      = document.getElementById('lbPanel');
const startBtn     = document.getElementById('startBtn');
const hudScore     = document.getElementById('hudScore');
const hudBest      = document.getElementById('hudBest');
const overlayScore = document.getElementById('overlayScore');
const overlayBest  = document.getElementById('overlayBest');
const overlayLabel = document.getElementById('overlayLabel');
const bestRow      = document.getElementById('bestRow');
const instrRow     = document.getElementById('instrRow');
const tip          = document.getElementById('tip');
const lbBtn        = document.getElementById('lbBtn');
const lbList       = document.getElementById('lbList');
const lbCloseBtn   = document.getElementById('lbCloseBtn');
const lbSaveBtn    = document.getElementById('lbSaveBtn');
const nameInput    = document.getElementById('nameInput');
const myRankBadge  = document.getElementById('myRankBadge');
const rankLink     = document.getElementById('rankLink');
const launchPrompt = document.getElementById('launchPrompt');

// ── Leaderboard — Global (Firebase) + Local fallback ────────
// ─────────────────────────────────────────────────────────────
// SETUP: Replace the firebaseConfig below with your own from
// Firebase Console → Project Settings → Your Web App.
// ─────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDusKjQxgO81zZBtr66nQc0IxulK8lXXa0",
  authDomain:        "airtaxi2099.firebaseapp.com",
  projectId:         "airtaxi2099",
  storageBucket:     "airtaxi2099.firebasestorage.app",
  messagingSenderId: "240208109054",
  appId:             "1:240208109054:web:2b02e0c7f78de4be3f74af",
  measurementId:     "G-GJG7BGWKRL"
};

const HS_KEY   = 'airtaxi2099_hs';
const NAME_KEY = 'airtaxi2099_name';
const DEVICE_KEY = 'airtaxi2099_device';
const MAX_ENTRIES = 20;

// Per-device ID — persists across name changes so one device = one leaderboard slot
function getDeviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    localStorage.setItem(DEVICE_KEY, id);
  }
  return id;
}
function getPlayerName() { return localStorage.getItem(NAME_KEY) || ''; }
function setPlayerName(n) { localStorage.setItem(NAME_KEY, n.toUpperCase().trim().slice(0, 10)); }

// ── Firebase init (lazy — only if config is filled in) ───────
let db = null;
const firebaseReady = (async () => {
  if (FIREBASE_CONFIG.apiKey === 'REPLACE_WITH_YOUR_API_KEY') return false;
  try {
    const { initializeApp }    = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, collection, doc, setDoc, getDoc, getDocs,
            query, orderBy, limit, serverTimestamp }
                               = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    db._col    = () => collection(db, 'scores');
    db._doc    = (id) => doc(db, 'scores', id);
    db._setDoc = setDoc;
    db._getDoc = getDoc;
    db._getDocs = getDocs;
    db._query  = query;
    db._orderBy = orderBy;
    db._limit  = limit;
    db._ts     = serverTimestamp;
    return true;
  } catch(e) {
    console.warn('Firebase init failed:', e);
    return false;
  }
})();

// ── Submit score to Firestore (one doc per device) ───────────
async function submitScore(score, forceNameUpdate = false) {
  if (score <= 0) return 'skip';
  const name     = getPlayerName() || 'DRIVER';
  const deviceId = getDeviceId();
  const today    = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });

  const ready = await firebaseReady;
  if (!ready || !db) return 'no_firebase';

  try {
    const ref      = db._doc(deviceId);
    const existing = await db._getDoc(ref);

    if (existing.exists()) {
      if (existing.data().score >= score) {
        if (forceNameUpdate) {
          await db._setDoc(ref, { ...existing.data(), name, updatedAt: db._ts() });
        }
        return 'not_best:' + existing.data().score;
      }
    }

    await db._setDoc(ref, {
      name,
      score,
      date: today,
      deviceId,
      updatedAt: db._ts()
    });
    return 'saved';
  } catch(e) {
    console.error('Score submit failed:', e);
    return 'error:' + (e.code || e.message || String(e));
  }
}

// ── Fetch top 10 + player's own entry ────────────────────────
async function fetchGlobalLeaderboard() {
  const ready = await firebaseReady;
  if (!ready || !db) return null; // signal: use local fallback

  try {
    const top10Query = db._query(
      db._col(),
      db._orderBy('score', 'desc'),
      db._limit(10)
    );
    const snap = await db._getDocs(top10Query);
    const entries = snap.docs.map(d => d.data());

    // Check if this device's entry is already in top 10
    const deviceId = getDeviceId();
    const myEntryInTop20 = entries.find(e => e.deviceId === deviceId);

    if (!myEntryInTop20) {
      // Fetch player's own entry separately so they always see their rank
      const myRef  = db._doc(deviceId);
      const mySnap = await db._getDoc(myRef);
      if (mySnap.exists()) {
        entries.push({ ...mySnap.data(), _isMyEntryBelow: true });
      }
    }

    return entries;
  } catch(e) {
    console.warn('Leaderboard fetch failed:', e);
    return null;
  }
}

// ── Render leaderboard (global if available, local fallback) ──
async function renderLeaderboard(highlightScore) {
  const deviceId   = getDeviceId();
  const playerName = getPlayerName() || 'DRIVER';
  lbList.innerHTML = '<div class="lb-empty">LOADING DRIVERS...</div>';
  // Wait for any in-flight score write to land before reading the leaderboard
  if (pendingScoreSubmit) {
    try { await pendingScoreSubmit; } catch(e) {}
    pendingScoreSubmit = null;
  }
  myRankBadge.style.display = 'none';

  const entries = await fetchGlobalLeaderboard();

  // If Firestore's query cache returned stale data missing our just-written entry,
  // inject it from the locally-known snapshot so it shows immediately after saving.
  if (entries !== null && localSubmittedEntry) {
    const myId = localSubmittedEntry.deviceId;
    if (!entries.some(e => e.deviceId === myId)) {
      entries.push({ ...localSubmittedEntry, _isMyEntryBelow: true });
    }
  }

  lbList.innerHTML = '';

  // No Firebase config yet — show a helpful message in the leaderboard
  if (entries === null) {
    lbList.innerHTML = `<div class="lb-empty">GLOBAL LEADERBOARD<br><br>
      Configure Firebase to see all drivers.<br>
      Your local scores are still saved.</div>`;
    return;
  }

  if (entries.length === 0) {
    lbList.innerHTML = '<div class="lb-empty">NO DRIVERS ON RECORD YET<br><br>FLY YOUR FIRST MISSION</div>';
    return;
  }

  const medals  = ['🥇','🥈','🥉'];
  // Top 10 entries are those without the _isMyEntryBelow flag
  const top10   = entries.filter(e => !e._isMyEntryBelow);
  const myBelow = entries.find(e => e._isMyEntryBelow);
  let myRank    = null;

  top10.forEach((entry, i) => {
    const isMe = entry.deviceId === deviceId;
    if (isMe) myRank = i + 1;

    const rankClass   = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    const rankDisplay = i < 3 ? medals[i] : `#${i + 1}`;
    const newBadge    = (isMe && highlightScore && entry.score === highlightScore)
      ? '<span class="new-badge">NEW</span>' : '';

    const row = document.createElement('div');
    row.className = `lb-row ${rankClass} ${isMe ? 'my-score' : ''}`;
    row.innerHTML = `
      <div class="lb-rank">${rankDisplay}</div>
      <div class="lb-name">${entry.name} ${newBadge}</div>
      <div class="lb-score">${entry.score}</div>
      <div class="lb-date">${entry.date || ''}</div>`;
    lbList.appendChild(row);
  });

  // If player is outside top 10, show them below a separator with gap to #10
  if (myBelow) {
    const sep = document.createElement('div');
    sep.style.cssText = 'text-align:center;color:rgba(255,255,255,0.2);font-size:10px;letter-spacing:3px;padding:6px 0';
    sep.textContent = '· · ·';
    lbList.appendChild(sep);

    const row = document.createElement('div');
    row.className = 'lb-row my-score';
    row.innerHTML = `
      <div class="lb-rank" style="color:var(--gold)">YOU</div>
      <div class="lb-name">${myBelow.name} <span class="new-badge">YOU</span></div>
      <div class="lb-score">${myBelow.score}</div>
      <div class="lb-date">${myBelow.date || ''}</div>`;
    lbList.appendChild(row);

    const tenthScore = top10.length >= 10 ? top10[9].score : null;
    const gap        = tenthScore !== null && myBelow.score < tenthScore ? tenthScore - myBelow.score : 0;
    myRankBadge.style.display = 'block';
    myRankBadge.innerHTML = gap > 0
      ? `YOUR RANK: <span>OUTSIDE TOP 10</span> &nbsp;·&nbsp; ${gap} PTS TO REACH #10`
      : `YOUR RANK: <span>OUTSIDE TOP 10</span>`;
  } else if (myRank !== null) {
    myRankBadge.style.display = 'block';
    myRankBadge.innerHTML = `YOUR GLOBAL RANK: <span>#${myRank}</span> of ${top10.length}+ drivers`;
  }
}

async function updateRankLink() {
  const ready = await firebaseReady;
  if (!ready || !db) { rankLink.style.display = 'none'; return; }
  try {
    const deviceId = getDeviceId();
    const mySnap   = await db._getDoc(db._doc(deviceId));
    if (!mySnap.exists()) { rankLink.style.display = 'none'; return; }

    // Count how many scores are higher than this player's to get their rank
    const myScore   = mySnap.data().score;
    const top10Snap = await db._getDocs(db._query(db._col(), db._orderBy('score','desc'), db._limit(10)));
    const top10     = top10Snap.docs.map(d => d.data());
    const idx       = top10.findIndex(e => e.deviceId === deviceId);

    rankLink.style.display = 'block';
    if (idx >= 0) {
      const medals = ['🥇','🥈','🥉'];
      const medal  = idx < 3 ? medals[idx] : '';
      rankLink.textContent = `${medal} GLOBAL RANK: #${idx + 1} · VIEW LEADERBOARD`;
    } else {
      rankLink.textContent = `🌐 VIEW GLOBAL LEADERBOARD`;
    }
  } catch(e) {
    rankLink.style.display = 'none';
  }
}

// ── Audio ────────────────────────────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

function playSound(type) {
  resumeAudio();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'tap') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.18);
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.start(now); osc.stop(now + 0.23);

    const wh = audioCtx.createOscillator();
    const wg = audioCtx.createGain();
    wh.connect(wg); wg.connect(audioCtx.destination);
    wh.type = 'sawtooth';
    wh.frequency.setValueAtTime(1800, now);
    wh.frequency.exponentialRampToValueAtTime(600, now + 0.22);
    wg.gain.setValueAtTime(0.12, now);
    wg.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    wh.start(now); wh.stop(now + 0.26);

    const cSize = Math.floor(audioCtx.sampleRate * 0.08);
    const cBuf = audioCtx.createBuffer(1, cSize, audioCtx.sampleRate);
    const cData = cBuf.getChannelData(0);
    for (let i = 0; i < cSize; i++) cData[i] = (Math.random() * 2 - 1) * 0.6;
    const cSrc = audioCtx.createBufferSource();
    const cGain = audioCtx.createGain();
    cSrc.buffer = cBuf; cSrc.connect(cGain); cGain.connect(audioCtx.destination);
    cGain.gain.setValueAtTime(0.28, now);
    cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    cSrc.start(now); cSrc.stop(now + 0.1);
  } else if (type === 'pickup') {
    for (let i = 0; i < 2; i++) {
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.type = 'triangle';
      const t = now + i * 0.07;
      o2.frequency.setValueAtTime(i === 0 ? 880 : 1320, t);
      g2.gain.setValueAtTime(0.22, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o2.start(t); o2.stop(t + 0.19);
    }
  } else if (type === 'collision') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    const bufSize = audioCtx.sampleRate * 0.25;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
    const src = audioCtx.createBufferSource();
    const ng = audioCtx.createGain();
    src.buffer = buf; src.connect(ng); ng.connect(audioCtx.destination);
    ng.gain.setValueAtTime(0.4, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    src.start(now); src.stop(now + 0.28);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'newRecord') {
    // Triumphant ascending arpeggio
    [523, 659, 784, 1047].forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'triangle';
      const t = now + i * 0.1;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.start(t); o.stop(t + 0.3);
    });
  }
}

// ── Taxi drawing ─────────────────────────────────────────────
function drawTaxi(x, y, thrusterFlicker, thrustBoost) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(-22, -8, 44, 16);

  ctx.fillStyle = '#0ff';
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.ellipse(-4, -8, 12, 7, 0, Math.PI, 0, true);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#001f3f';
  ctx.beginPath();
  ctx.ellipse(-4, -7, 9, 5, 0, Math.PI, 0, true);
  ctx.fill();

  ctx.fillStyle = '#f0f';
  ctx.fillRect(-22, -2, 44, 3);
  ctx.shadowBlur = 6; ctx.shadowColor = '#f0f';
  ctx.fillRect(-22, -2, 44, 3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(16, -14, 6, 6);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(18, -12, 2, 4);

  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 8; ctx.shadowColor = '#0ff';
  ctx.fillRect(-24, -4, 4, 3);
  ctx.fillRect(-24, 2, 4, 3);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#222244';
  ctx.beginPath();
  ctx.moveTo(-16, 7); ctx.lineTo(-10, 7); ctx.lineTo(-8, 13); ctx.lineTo(-18, 13);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1;
  ctx.shadowBlur = 4; ctx.shadowColor = '#0ff'; ctx.stroke(); ctx.shadowBlur = 0;

  ctx.fillStyle = '#222244';
  ctx.beginPath();
  ctx.moveTo(10, 7); ctx.lineTo(16, 7); ctx.lineTo(18, 13); ctx.lineTo(8, 13);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1;
  ctx.shadowBlur = 4; ctx.shadowColor = '#0ff'; ctx.stroke(); ctx.shadowBlur = 0;

  if (thrusterFlicker) {
    function drawRocketFlame(cx, nozzleY) {
      const boostMult = thrustBoost ? (1.5 + Math.random() * 0.6) : (0.6 + Math.random() * 0.3);
      const flicker  = boostMult * (0.85 + Math.random() * 0.3);
      const flicker2 = boostMult * (0.8  + Math.random() * 0.4);

      const outerLen = (22 + Math.random() * 10) * flicker;
      const outerW = 9;
      const ogOuter = ctx.createLinearGradient(cx, nozzleY, cx, nozzleY + outerLen);
      ogOuter.addColorStop(0, 'rgba(80,0,255,0.85)');
      ogOuter.addColorStop(0.25, 'rgba(0,180,255,0.75)');
      ogOuter.addColorStop(0.6, 'rgba(255,80,255,0.4)');
      ogOuter.addColorStop(1, 'rgba(255,0,180,0)');
      ctx.save();
      ctx.fillStyle = ogOuter;
      ctx.shadowBlur = 18; ctx.shadowColor = '#60f';
      ctx.beginPath();
      ctx.moveTo(cx - outerW / 2, nozzleY);
      ctx.quadraticCurveTo(cx - outerW * 0.8, nozzleY + outerLen * 0.5, cx, nozzleY + outerLen);
      ctx.quadraticCurveTo(cx + outerW * 0.8, nozzleY + outerLen * 0.5, cx + outerW / 2, nozzleY);
      ctx.closePath(); ctx.fill(); ctx.restore();

      const midLen = (14 + Math.random() * 8) * flicker2;
      const midW = 5.5;
      const ogMid = ctx.createLinearGradient(cx, nozzleY, cx, nozzleY + midLen);
      ogMid.addColorStop(0, 'rgba(255,255,255,1)');
      ogMid.addColorStop(0.2, 'rgba(0,255,255,0.95)');
      ogMid.addColorStop(0.6, 'rgba(0,180,255,0.6)');
      ogMid.addColorStop(1, 'rgba(0,100,255,0)');
      ctx.save();
      ctx.fillStyle = ogMid;
      ctx.shadowBlur = 14; ctx.shadowColor = '#0ff';
      ctx.beginPath();
      ctx.moveTo(cx - midW / 2, nozzleY);
      ctx.quadraticCurveTo(cx - midW * 0.6, nozzleY + midLen * 0.45, cx, nozzleY + midLen);
      ctx.quadraticCurveTo(cx + midW * 0.6, nozzleY + midLen * 0.45, cx + midW / 2, nozzleY);
      ctx.closePath(); ctx.fill(); ctx.restore();

      const coreLen = (8 + Math.random() * 5) * flicker;
      const coreW = 2.5;
      const ogCore = ctx.createLinearGradient(cx, nozzleY, cx, nozzleY + coreLen);
      ogCore.addColorStop(0, 'rgba(255,255,255,1)');
      ogCore.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.fillStyle = ogCore;
      ctx.shadowBlur = 8; ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.moveTo(cx - coreW / 2, nozzleY);
      ctx.lineTo(cx, nozzleY + coreLen);
      ctx.lineTo(cx + coreW / 2, nozzleY);
      ctx.closePath(); ctx.fill(); ctx.restore();

      for (let d = 0; d < 2; d++) {
        const dy = nozzleY + 5 + d * 6 + Math.random() * 2;
        ctx.save();
        ctx.globalAlpha = 0.7 - d * 0.25;
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 5; ctx.shadowColor = '#0ff';
        ctx.beginPath();
        ctx.ellipse(cx, dy, 1.8 - d * 0.4, 2.5 - d * 0.5, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.restore();
      }
    }
    drawRocketFlame(-13, 13);
    drawRocketFlame( 13, 13);

    ctx.save();
    const heatGrad = ctx.createRadialGradient(0, 10, 0, 0, 10, 22);
    heatGrad.addColorStop(0, 'rgba(0,200,255,0.18)');
    heatGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = heatGrad;
    ctx.fillRect(-22, 7, 44, 24);
    ctx.restore();
  } else {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#f06';
    ctx.shadowBlur = 6; ctx.shadowColor = '#f06';
    ctx.beginPath(); ctx.arc(-13, 12, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 13, 12, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
  }
  ctx.restore();
}

function drawPassenger(x, y, bobOffset) {

// ── Particle System ──────────────────────────────────────────
class Particle {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.life = 1;
    if (type === 'spark') {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed - 1;
      this.size = 2 + Math.random() * 3;
      this.color = Math.random() < 0.5 ? '#0ff' : '#ff0';
      this.decay = 0.04 + Math.random() * 0.04;
    } else if (type === 'smoke') {
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = -0.5 - Math.random() * 0.8;
      this.size = 4 + Math.random() * 6;
      this.color = '#ffffff';
      this.decay = 0.025 + Math.random() * 0.02;
    } else if (type === 'ember') {
      const spread = (Math.random() - 0.5) * 1.8;
      const speed = 2.5 + Math.random() * 4.5;
      this.vx = spread; this.vy = speed;
      this.size = 1.5 + Math.random() * 2.5;
      const r = Math.floor(200 + Math.random() * 55);
      const g = Math.floor(Math.random() * 160);
      this.color = `rgb(${r},${g},20)`;
      this.decay = 0.055 + Math.random() * 0.05;
      this.gravity = 0.12;
    } else if (type === 'plasma') {
      this.vx = (Math.random() - 0.5) * 2.5;
      this.vy = 1.5 + Math.random() * 2.5;
      this.size = 3 + Math.random() * 4;
      this.color = Math.random() < 0.5 ? '#0ff' : '#80f';
      this.decay = 0.04 + Math.random() * 0.035;
      this.gravity = 0.06;
    }
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.type === 'ember' || this.type === 'plasma') {
      this.vy += this.gravity; this.vx *= 0.97;
    } else { this.vy += 0.05; }
    this.life -= this.decay;
    this.size *= 0.96;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life) * 0.9;
    ctx.fillStyle = this.color;
    if (this.type === 'spark' || this.type === 'ember') {
      ctx.shadowBlur = this.type === 'ember' ? 4 : 6;
      ctx.shadowColor = this.color;
      ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    } else {
      ctx.shadowBlur = this.type === 'plasma' ? 8 : 0;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.restore();
  }
}

// ── Background ────────────────────────────────────────────────
const STARS = Array.from({ length: 120 }, () => ({
  x: Math.random() * W, y: Math.random() * (H * 0.65),
  r: Math.random() < 0.15 ? 1.5 : 0.8,
  twinkle: Math.random() * Math.PI * 2,
  speed: 0.02 + Math.random() * 0.03,
}));

const FAR_BUILDINGS = generateBuildingSet(0.25, '#0d1033', '#111844');
const NEAR_BUILDINGS = generateBuildingSet(0.7, '#080820', '#0c0c30');

function generateBuildingSet(speedFactor, bodyColor, windowColor) {
  const cols = [];
  let x = 0;
  while (x < W * 2.5) {
    const bw = 22 + Math.floor(Math.random() * 40);
    const bh = 70 + Math.floor(Math.random() * 240);
    const windows = [];
    for (let wy = H - bh + 8; wy < H - 4; wy += 14) {
      for (let wx = 4; wx < bw - 4; wx += 10) {
        if (Math.random() < 0.55) {
          windows.push({ lx: wx, ly: wy, lit: Math.random() < 0.7,
            color: Math.random() < 0.25 ? 'rgba(255,0,255,0.5)' : 'rgba(0,255,255,0.3)' });
        }
      }
    }
    cols.push({ x, bw, bh, bodyColor, windowColor, windows, hasAntenna: bw > 35 });
    x += bw + 3 + Math.floor(Math.random() * 18);
  }
  return { cols, totalW: x, speed: speedFactor, offset: 0 };
}

function drawBuildingLayer(layer, yBase) {
  const total = layer.totalW;
  if (scrolling) {
    layer.offset += layer.speed;
    if (layer.offset >= total) layer.offset -= total;
  }
  layer.cols.forEach(b => {
    let bx = b.x - layer.offset;
    while (bx > W) bx -= total;
    if (bx + b.bw < 0) return;
    const by = yBase - b.bh;
    ctx.fillStyle = b.bodyColor;
    ctx.fillRect(bx, by, b.bw, b.bh);
    b.windows.forEach(win => {
      if (!win.lit) return;
      ctx.fillStyle = win.color;
      ctx.fillRect(bx + win.lx, win.ly, 5, 8);
    });
    if (b.hasAntenna) {
      ctx.fillStyle = b.bodyColor;
      ctx.fillRect(bx + b.bw / 2 - 1, by - 14, 2, 14);
      ctx.fillStyle = '#f00';
      ctx.shadowBlur = 4; ctx.shadowColor = '#f00';
      ctx.beginPath(); ctx.arc(bx + b.bw / 2, by - 14, 2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  });
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#000005');
  sky.addColorStop(0.45, '#05001a');
  sky.addColorStop(1, '#120020');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  STARS.forEach(s => {
    if (scrolling) s.twinkle += s.speed;
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });

  const hg = ctx.createLinearGradient(0, H * 0.55, 0, H * 0.72);
  hg.addColorStop(0, 'transparent');
  hg.addColorStop(0.5, 'rgba(0,60,120,0.35)');
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg;
  ctx.fillRect(0, H * 0.55, W, H * 0.2);

  drawBuildingLayer(FAR_BUILDINGS, H);

  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, H - 18, W, 18);
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8; ctx.shadowColor = '#0ff';
  ctx.beginPath(); ctx.moveTo(0, H - 18); ctx.lineTo(W, H - 18); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, 0, W, 14);
  ctx.strokeStyle = '#f0f'; ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8; ctx.shadowColor = '#f0f';
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(W, 14); ctx.stroke();
  ctx.shadowBlur = 0;
}

// ── Platforms ─────────────────────────────────────────────────
function drawPlatforms() {
  platforms.forEach(p => {
    const yOff = Math.sin(p.phase) * PLATFORM_WOBBLE_AMP;
    const topH = p.gapY + yOff;
    const botY = p.gapY + yOff + GAP_SIZE;
    const botH = H - botY - 18;
    drawSkyscraper(p.x, 14, p.w, topH - 14);
    if (botH > 0) drawSkyscraper(p.x, botY, p.w, botH);
  });
}

function drawSkyscraper(x, y, w, h) {
  if (h <= 0) return;
  const grad = ctx.createLinearGradient(x, y, x + w, y);
  grad.addColorStop(0, '#0d1040');
  grad.addColorStop(0.4, '#141860');
  grad.addColorStop(1, '#0d1040');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#0ff';
  ctx.shadowBlur = 8; ctx.shadowColor = '#0ff';
  ctx.fillRect(x, y, 2, h);
  ctx.fillStyle = '#f0f';
  ctx.shadowColor = '#f0f';
  ctx.fillRect(x + w - 2, y, 2, h);
  ctx.shadowBlur = 0;
  for (let wy = y + 6; wy < y + h - 4; wy += 13) {
    for (let wx = x + 5; wx < x + w - 5; wx += 10) {
      const lit = (Math.floor(frame / 40 + wx + wy) % 5 !== 0);
      if (lit) {
        ctx.fillStyle = Math.random() < 0.15 ? 'rgba(255,0,255,0.6)' : 'rgba(0,200,255,0.4)';
        ctx.fillRect(wx, wy, 5, 7);
      }
    }
  }
  ctx.fillStyle = '#f0f';
  ctx.shadowBlur = 6; ctx.shadowColor = '#f0f';
  ctx.fillRect(x, y, w, 2);
  ctx.shadowBlur = 0;
}

// ── Game State ────────────────────────────────────────────────
let state = 'menu'; // 'menu' | 'launchpad' | 'playing' | 'dead' | 'revive'
let scrolling = false; // background only scrolls once airborne
let score = 0;
let highScore = parseInt(localStorage.getItem(HS_KEY) || '0');
let frame = 0;
let lastScoreSubmitted = null;
let pendingScoreSubmit = null;
let localSubmittedEntry = null; // fallback when Firestore query cache is stale

// Launchpad config
const LAUNCHPAD_X = 140;        // same as TAXI.x — shifted right so taxi stays in view with cover scaling
const LAUNCHPAD_Y = H - 18;     // ground level
const LAUNCHPAD_W = 80;
const LAUNCHPAD_H = 10;
// Taxi rests on top of pad: taxiY = LAUNCHPAD_Y - LAUNCHPAD_H - TAXI.height/2
const TAXI_REST_Y = LAUNCHPAD_Y - LAUNCHPAD_H - 10; // 10 = half taxi height

let launchpadFrame = 0; // frame counter for launchpad animations

/** Draw the futuristic launchpad platform */
function drawLaunchpad() {
  const px = LAUNCHPAD_X - LAUNCHPAD_W / 2;
  const py = LAUNCHPAD_Y - LAUNCHPAD_H;

  // Support struts
  ctx.fillStyle = '#0a0a2a';
  ctx.fillRect(px + 8, py + LAUNCHPAD_H, 6, 14);
  ctx.fillRect(px + LAUNCHPAD_W - 14, py + LAUNCHPAD_H, 6, 14);

  // Platform base
  const baseGrad = ctx.createLinearGradient(px, py, px, py + LAUNCHPAD_H);
  baseGrad.addColorStop(0, '#141860');
  baseGrad.addColorStop(1, '#0a0a30');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(px, py, LAUNCHPAD_W, LAUNCHPAD_H);

  // Neon edge top
  const pulse = 0.6 + 0.4 * Math.sin(launchpadFrame * 0.12);
  ctx.fillStyle = `rgba(0,255,255,${pulse})`;
  ctx.shadowBlur = 10 * pulse; ctx.shadowColor = '#0ff';
  ctx.fillRect(px, py, LAUNCHPAD_W, 2);
  ctx.shadowBlur = 0;

  // Side trim
  ctx.fillStyle = 'rgba(255,0,255,0.6)';
  ctx.fillRect(px, py + 2, 2, LAUNCHPAD_H - 2);
  ctx.fillRect(px + LAUNCHPAD_W - 2, py + 2, 2, LAUNCHPAD_H - 2);

  // Centre runway lights — blinking sequence
  const numLights = 5;
  const step = (LAUNCHPAD_W - 16) / (numLights - 1);
  for (let i = 0; i < numLights; i++) {
    const lit = (Math.floor(launchpadFrame / 8) + i) % numLights < 3;
    const lx = px + 8 + i * step;
    const ly = py + 5;
    ctx.fillStyle = lit ? '#ffd700' : '#221100';
    ctx.shadowBlur = lit ? 8 : 0; ctx.shadowColor = '#ffd700';
    ctx.beginPath(); ctx.arc(lx, ly, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // "LAUNCH" text on pad
  ctx.fillStyle = `rgba(0,255,255,${0.4 + 0.3 * pulse})`;
  ctx.font = `bold ${6}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('LAUNCH', LAUNCHPAD_X, py + LAUNCHPAD_H / 2 + 1);

  // Heat shimmer / ground glow when engines running
  if (state === 'launchpad') {
    const glow = ctx.createRadialGradient(LAUNCHPAD_X, py, 0, LAUNCHPAD_X, py, 38);
    glow.addColorStop(0, `rgba(0,180,255,${0.2 * pulse})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(LAUNCHPAD_X - 38, py - 20, 76, 24);
  }
}

const TAXI = { x: LAUNCHPAD_X, y: H / 2, vy: 0, GRAVITY: 0.38, FLAP: -7.5, width: 44, height: 20 };

let platforms = [];
const PLATFORM_SPEED = 2.4;
const GAP_SIZE = 170;
const SPAWN_INTERVAL = 110;
const PLATFORM_WOBBLE_AMP = 30;
const PLATFORM_W = 58;

let passengers = [];
let particles = [];

function spawnPlatform() {
  const minY = 80, maxY = H - 80 - GAP_SIZE;
  const gapY = minY + Math.random() * (maxY - minY);
  platforms.push({ x: W + 10, gapY, phase: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.015, scored: false, w: PLATFORM_W });
  const count = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < count; i++) {
    const py = gapY + 30 + Math.random() * (GAP_SIZE - 60);
    const px = W + 10 + PLATFORM_W / 2 + (i === 1 ? 30 : 0);
    passengers.push({ x: px, y: py, bobPhase: Math.random() * Math.PI * 2, collected: false, alpha: 1 });
  }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function emitPickup(x, y) {
  for (let i = 0; i < 16; i++) particles.push(new Particle(x, y, 'spark'));
  for (let i = 0; i < 6; i++) particles.push(new Particle(x, y, 'smoke'));
}

function emitCrash(x, y) {
  for (let i = 0; i < 30; i++) particles.push(new Particle(x, y, 'spark'));
  for (let i = 0; i < 12; i++) particles.push(new Particle(x, y, 'smoke'));
}

function resetGame() {
  TAXI.x = LAUNCHPAD_X;
  TAXI.y = TAXI_REST_Y;
  TAXI.vy = 0;
  score = 0; frame = 0; launchpadFrame = 0;
  scrolling = false;
  platforms = []; passengers = []; particles = [];
  continueUsed = false; invulnFrames = 0;
  hudScore.textContent = '0';
  hudBest.textContent = highScore;
}

// ── Input ──────────────────────────────────────────────────────
function flap() {
  if (state === 'launchpad') {
    // Lift off! Begin the game
    state = 'playing';
    scrolling = true;
    TAXI.vy = TAXI.FLAP;
    launchPrompt.classList.add('hidden');
    startMusic();
    playSound('tap');
    for (let i = 0; i < 14; i++) particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'ember'));
    for (let i = 0; i < 14; i++) particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'ember'));
    for (let i = 0; i < 8; i++) particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'plasma'));
    for (let i = 0; i < 8; i++) particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'plasma'));
  } else if (state === 'revive') {
    // Second chance — resume the same run
    state = 'playing';
    scrolling = true;
    TAXI.vy = TAXI.FLAP;
    launchPrompt.classList.add('hidden');
    resetLaunchPromptText();
    startMusic();
    playSound('tap');
  } else if (state === 'playing') {
    TAXI.vy = TAXI.FLAP;
    playSound('tap');
    for (let i = 0; i < 10; i++) particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'ember'));
    for (let i = 0; i < 10; i++) particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'ember'));
    for (let i = 0; i < 5; i++) particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'plasma'));
    for (let i = 0; i < 5; i++) particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'plasma'));
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

startBtn.addEventListener('click', e => {
  e.stopPropagation();
  resumeAudio();
  const isRetry = state === 'dead';
  startGame();
  // The ad opens over the launchpad (the run hasn't started until they tap),
  // so it never interrupts play or hides the score screen.
  if (isRetry) maybeShowInterstitial();
});

function startGame() {
  resetGame();
  state = 'launchpad';
  overlay.classList.add('hidden');
  lbPanel.classList.add('hidden');
  continueBtn.style.display = 'none';
  resetLaunchPromptText();
  launchPrompt.classList.remove('hidden');
}

function gameOver() {
  state = 'dead';
  try { stopMusic(); } catch(e) {}
  try { playSound('collision'); } catch(e) {}
  try { emitCrash(TAXI.x, TAXI.y); } catch(e) {}
  launchPrompt.classList.add('hidden');

  const isNewRecord = score > highScore;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem(HS_KEY, highScore);
    setTimeout(() => playSound('newRecord'), 300);
  }

  lastScoreSubmitted = score;
  const _entrySnapshot = {
    name: getPlayerName() || 'DRIVER',
    score: highScore,
    date: new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' }),
    deviceId: getDeviceId()
  };
  pendingScoreSubmit = submitScore(highScore).then(result => {
    if (result === 'saved') localSubmittedEntry = _entrySnapshot;
    return result;
  });

  setTimeout(() => {
    overlayLabel.textContent = isNewRecord ? '🏆 NEW RECORD!' : (score === 0 ? 'BETTER LUCK NEXT TIME' : 'PASSENGERS DELIVERED');
    overlayScore.textContent = score;
    overlayScore.style.display = 'block';
    overlayBest.textContent = highScore;
    bestRow.style.display = 'block';
    instrRow.style.display = 'none';
    tip.style.display = 'none';
    startBtn.textContent = 'RETRY';
    updateContinueButton();
    updatePrivacyLink();
    overlay.classList.remove('hidden');
    hudBest.textContent = highScore;
    updateRankLink();

    const hasName = !!getPlayerName();
    if (continueOffered) {
      // Keep the CONTINUE button visible; the leaderboard is one tap away
      // and opens automatically after the run really ends.
    } else if (isNewRecord && score > 0) {
      // Open leaderboard; if no name set, focus input so they name themselves immediately
      setTimeout(() => {
        openLeaderboard(score);
        if (!hasName) {
          setTimeout(() => { nameInput.focus(); nameInput.select(); }, 200);
        }
      }, 800);
    } else if (!hasName && score > 0) {
      // First score ever — nudge them to set a callsign
      setTimeout(() => {
        openLeaderboard(score);
        setTimeout(() => { nameInput.focus(); nameInput.select(); }, 200);
      }, 1000);
    }
  }, 600);
}

// ── Update ────────────────────────────────────────────────────
function updateLaunchpad() {
  launchpadFrame++;
  // Idle exhaust drip while on pad
  if (launchpadFrame % 3 === 0) {
    particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'plasma'));
    particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'plasma'));
  }
  if (launchpadFrame % 7 === 0) {
    particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'ember'));
    particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'ember'));
  }
  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0);
}

function update() {
  frame++;
  launchpadFrame++;
  if (invulnFrames > 0) invulnFrames--;
  TAXI.vy += TAXI.GRAVITY;
  TAXI.vy = Math.min(TAXI.vy, 12);
  TAXI.y += TAXI.vy;

  if (TAXI.y - TAXI.height / 2 < 14 || TAXI.y + TAXI.height / 2 > H - 18) {
    gameOver(); return;
  }

  if (frame % SPAWN_INTERVAL === 0) spawnPlatform();

  for (const p of platforms) {
    p.x -= PLATFORM_SPEED;
    p.phase += p.wobbleSpeed;
    const yOff = Math.sin(p.phase) * PLATFORM_WOBBLE_AMP;
    const topH = p.gapY + yOff;
    const botY = p.gapY + yOff + GAP_SIZE;
    const botH = H - botY - 18;
    if (invulnFrames > 0) continue; // shields up for a moment after a revive
    if (rectsOverlap(TAXI.x - TAXI.width / 2, TAXI.y - TAXI.height / 2, TAXI.width, TAXI.height, p.x, 14, p.w, topH - 14)) { gameOver(); return; }
    if (botH > 0 && rectsOverlap(TAXI.x - TAXI.width / 2, TAXI.y - TAXI.height / 2, TAXI.width, TAXI.height, p.x, botY, p.w, botH)) { gameOver(); return; }
  }
  platforms = platforms.filter(p => p.x + p.w > -10);

  passengers.forEach(pas => {
    pas.x -= PLATFORM_SPEED;
    pas.bobPhase += 0.06;
    if (!pas.collected && rectsOverlap(TAXI.x - TAXI.width / 2, TAXI.y - TAXI.height / 2, TAXI.width, TAXI.height, pas.x - 12, pas.y - 12, 24, 24)) {
      pas.collected = true;
      score++;
      hudScore.textContent = score;
      playSound('pickup');
      emitPickup(pas.x, pas.y);
    }
  });
  passengers = passengers.filter(p => !p.collected && p.x > -20);

  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0);

  if (frame % 3 === 0) {
    particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'plasma'));
    particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'plasma'));
  }
  if (frame % 5 === 0) {
    particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'ember'));
    particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'ember'));
  }
}

// ── Draw ──────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Portrait viewports (phones) use cover — fills screen edge-to-edge with slight side crop.
  // Landscape/wide viewports (desktop, tablet landscape) use contain — full game always visible.
  // Cover (crop, full-bleed) for any portrait-or-square screen — including
  // near-square unfolded foldables (e.g. Galaxy Fold) that would otherwise
  // trip the old narrow-aspect threshold and letterbox instead of filling.
  // Contain only kicks in once the screen is genuinely wider than tall.
  const useCover = canvas.width <= canvas.height;
  const drawScale = useCover
    ? Math.max(canvas.width / W, canvas.height / H)
    : Math.min(canvas.width / W, canvas.height / H);
  const ox = (canvas.width  - W * drawScale) / 2;
  const oy = (canvas.height - H * drawScale) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(drawScale, drawScale);

  drawBackground();
  drawPlatforms();
  passengers.forEach(pas => { const bob = Math.sin(pas.bobPhase) * 5; drawPassenger(pas.x, pas.y, bob); });
  particles.forEach(p => p.draw());

  // Draw launchpad whenever taxi is on or near it
  if (state === 'launchpad' || state === 'menu') {
    drawLaunchpad();
  }

  const thruster = state === 'playing' || state === 'launchpad' || state === 'revive';
  const thrustBoost = state === 'playing' && TAXI.vy < 0;
  const shieldFlicker = invulnFrames > 0 && Math.floor(frame / 5) % 2 === 0;
  if (shieldFlicker) ctx.globalAlpha = 0.45;
  drawTaxi(TAXI.x, TAXI.y, thruster, thrustBoost);
  ctx.globalAlpha = 1;

  if (state === 'dead' && frame % 6 < 3) {
    ctx.fillStyle = 'rgba(255,50,50,0.15)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

// ── Loop ──────────────────────────────────────────────────────
let lastTime = 0;
function loop(timestamp) {
  const dt = timestamp - lastTime;
  if (dt >= 16) {
    lastTime = timestamp;
    if (state === 'launchpad') updateLaunchpad();
    else if (state === 'revive') updateRevive();
    else if (state === 'playing') update();
    draw();
  }
  requestAnimationFrame(loop);
}


// ── Music: Velours Palace — streamed & looped via <audio> ───────
// The track lives in music.mp3 rather than inline in this file. It used
// to be a ~6.3MB base64 string decoded with decodeAudioData, which
// expands to a ~98MB float32 PCM buffer held for the life of the page —
// enough to get the WebView renderer OOM-killed on low-RAM Android
// devices, which takes the whole app down with it. An <audio> element
// decodes incrementally, so memory stays flat.
const musicEl = new Audio('music.mp3');
musicEl.loop = true;
musicEl.volume = 0.55;
musicEl.preload = 'auto';
let musicStarted = false;

async function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  try {
    if (musicEl.readyState > 0) musicEl.currentTime = 0;
    await musicEl.play();
  } catch(e) {
    // Autoplay blocked or not buffered yet — let the next gesture retry.
    musicStarted = false;
    console.warn('Music playback failed:', e);
  }
}

function stopMusic() {
  musicStarted = false;
  musicEl.pause();
}

// ── Version & Service Worker ─────────────────────────────────
const GAME_VERSION = '1.2.1'; // bump this + CACHE_VERSION in sw.js on every release

const updateBanner = document.getElementById('updateBanner');
updateBanner.addEventListener('click', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    });
  }
  window.location.reload();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        setInterval(() => reg.update(), 60000);
        const showUpdateBanner = () => {
          if (reg.waiting) updateBanner.classList.add('visible');
        };
        if (reg.waiting) showUpdateBanner();
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        });
      })
      .catch(() => {}); // silently skip if SW not supported (e.g. some WebViews)

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; window.location.reload(); }
    });
  });
}

// ── Ads ───────────────────────────────────────────────────────
// Everything here only does something inside the Android app, which
// exposes window.AndroidBridge. In a browser no ads or buttons appear.
//
// Interstitial: shown when the player taps RETRY (every 3rd retry), so it
//   never interrupts a run or covers the score screen.
// Rewarded: once per run, "watch an ad to continue" revives the taxi.
const INTERSTITIAL_EVERY = 3;
const REVIVE_INVULN_FRAMES = 90; // ~1.5 s of shields after a revive
const continueBtn  = document.getElementById('continueBtn');
const privacyLink  = document.getElementById('privacyLink');
const lpLine1      = document.getElementById('lpLine1');
const lpLine2      = document.getElementById('lpLine2');
const LP_DEFAULT_1 = lpLine1.textContent;
const LP_DEFAULT_2 = lpLine2.textContent;
const CONTINUE_LABEL = continueBtn.textContent;

let retryCount      = 0;
let continueUsed    = false; // one revive per run
let continueOffered = false; // the death screen is offering it right now
let rewardPending   = false; // rewarded ad is on screen
let invulnFrames    = 0;

function bridgeHas(fn) {
  try { return !!(window.AndroidBridge && typeof window.AndroidBridge[fn] === 'function'); }
  catch (e) { return false; }
}

function resetLaunchPromptText() {
  lpLine1.textContent = LP_DEFAULT_1;
  lpLine2.textContent = LP_DEFAULT_2;
}

function maybeShowInterstitial() {
  retryCount++;
  if (retryCount % INTERSTITIAL_EVERY !== 0) return;
  try { if (bridgeHas('onGameOver')) window.AndroidBridge.onGameOver(); } catch (e) {}
}

function rewardedReady() {
  try {
    return bridgeHas('isRewardedReady') && bridgeHas('showRewarded') &&
           window.AndroidBridge.isRewardedReady() === true;
  } catch (e) { return false; }
}

function canOfferContinue() {
  return state === 'dead' && !continueUsed && score > 0 && rewardedReady();
}

function updateContinueButton() {
  continueOffered = canOfferContinue();
  continueBtn.style.display = continueOffered ? 'block' : 'none';
  continueBtn.disabled = rewardPending;
  if (!rewardPending) continueBtn.textContent = CONTINUE_LABEL;
}

continueBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (rewardPending || !canOfferContinue()) return;
  rewardPending = true;
  continueBtn.disabled = true;
  continueBtn.textContent = 'LOADING…';
  try { window.AndroidBridge.showRewarded(); }
  catch (err) { rewardPending = false; updateContinueButton(); }
});

function revive() {
  continueUsed = true;
  continueOffered = false;
  continueBtn.style.display = 'none';
  overlay.classList.add('hidden');
  lbPanel.classList.add('hidden');
  try { blurInputs(); } catch (e) {}
  // Clear the buildings around the taxi so it isn't revived inside a wall.
  platforms = platforms.filter(p => p.x > TAXI.x + 160 || p.x + p.w < TAXI.x - TAXI.width);
  TAXI.y = H / 2;
  TAXI.vy = 0;
  invulnFrames = REVIVE_INVULN_FRAMES;
  state = 'revive';
  lpLine1.textContent = '▲ TAP TO RESUME ▲';
  lpLine2.textContent = 'SHIELDS UP · SECOND CHANCE';
  launchPrompt.classList.remove('hidden');
}

function updateRevive() {
  launchpadFrame++;
  TAXI.y = H / 2 + Math.sin(launchpadFrame * 0.08) * 4; // hover in place
  if (launchpadFrame % 3 === 0) {
    particles.push(new Particle(TAXI.x - 13, TAXI.y + 13, 'plasma'));
    particles.push(new Particle(TAXI.x + 13, TAXI.y + 13, 'plasma'));
  }
  particles.forEach(p => p.update());
  particles = particles.filter(p => p.life > 0);
}

// ── Called by the Android app ──
// The player watched the whole rewarded ad (sent after the ad closes).
window.onRewardEarned = function () {
  rewardPending = false;
  continueBtn.disabled = false;
  continueBtn.textContent = CONTINUE_LABEL;
  if (state === 'dead' && !continueUsed) revive();
};
// The ad closed early or failed to show — no reward.
window.onRewardClosed = function () {
  rewardPending = false;
  updateContinueButton();
};
// A rewarded ad finished loading; reveal CONTINUE if we're on the death screen.
window.onRewardedReady = function () {
  if (state === 'dead' && !rewardPending) updateContinueButton();
};

function updatePrivacyLink() {
  let show = false;
  try {
    show = bridgeHas('isPrivacyOptionsRequired') && bridgeHas('showPrivacyOptions') &&
           window.AndroidBridge.isPrivacyOptionsRequired() === true;
  } catch (e) {}
  privacyLink.style.display = show ? 'block' : 'none';
}
window.onPrivacyOptionsStatus = updatePrivacyLink;
privacyLink.addEventListener('click', e => {
  e.stopPropagation();
  try { if (bridgeHas('showPrivacyOptions')) window.AndroidBridge.showPrivacyOptions(); } catch (err) {}
});
updatePrivacyLink();

// ── Init ──────────────────────────────────────────────────────
TAXI.y = TAXI_REST_Y; // start on launchpad
hudBest.textContent = highScore;
overlayBest.textContent = highScore;
nameInput.value = getPlayerName();
updateRankLink();

requestAnimationFrame(loop);

// ── Hide loading screen ──────────────────────────────────────
// By the time this line runs, the whole (large, single-file) game has
// finished downloading and parsing — the slow part players sometimes
// hit on flaky connections. Keep the splash up for a short minimum
// so it never just flashes on fast connections.
const loadingScreen = document.getElementById('loadingScreen');
const LOADING_SCREEN_MIN_MS = 500;
setTimeout(() => loadingScreen.classList.add('hidden'), LOADING_SCREEN_MIN_MS);
</script>
